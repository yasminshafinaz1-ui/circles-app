<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Circles</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--offwhite);
      padding: 24px;
    }
    .login-wrap { width: 100%; max-width: 420px; }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Fraunces', serif;
      font-weight: 900;
      font-size: 1.4rem;
      color: var(--ink);
      text-decoration: none;
      margin-bottom: 36px;
      justify-content: center;
    }
    .login-logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--active); }
    .login-card {
      background: var(--white);
      border-radius: var(--radius-card);
      border: 2px solid var(--border);
      padding: 40px 36px;
      box-shadow: var(--shadow-md);
    }
    .login-card h1 { font-size: 1.8rem; margin-bottom: 4px; }
    .login-card .sub { font-size: 0.9rem; margin-bottom: 28px; }
    .login-card .sub a { color: var(--career); font-weight: 700; }
    .login-btn { width: 100%; margin-top: 8px; }
    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--ink-light);
      font-weight: 600;
      cursor: pointer;
    }
    .forgot-link:hover { color: var(--ink); }
    .global-error {
      background: #fff0f0;
      border: 2px solid var(--active);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--active);
      margin-bottom: 16px;
      display: none;
    }
    .global-error.visible { display: block; }
  </style>
</head>
<body>

<div class="login-wrap">
  <a href="/" class="login-logo">
    <span class="login-logo-dot"></span>
    Circles
  </a>

  <div class="login-card">
    <h1>Welcome back</h1>
    <p class="sub">New here? <a href="/signup.html">Sign up free →</a></p>

    <div class="global-error" id="global-error"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" placeholder="you@email.com" required autocomplete="email" />
        <div class="form-error" id="email-error">Please enter your email</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" placeholder="Your password" required autocomplete="current-password" />
        <div class="form-error" id="password-error">Please enter your password</div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg login-btn" id="login-btn">Log In</button>
    </form>

    <span class="forgot-link" onclick="forgotPassword()">Forgot password?</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
<script>
  // Redirect if already logged in
  (async () => {
    const session = await getSession();
    if (session) window.location.href = '/dashboard.html';
  })();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    let valid = true;
    if (!email) { showFieldError('email', 'email-error'); valid = false; }
    if (!password) { showFieldError('password', 'password-error'); valid = false; }
    if (!valid) return;

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Logging in…';

    try {
      await signIn(email, password);
      window.location.href = '/dashboard.html';
    } catch (err) {
      const errorEl = document.getElementById('global-error');
      errorEl.textContent = err.message || 'Login failed. Check your email and password.';
      errorEl.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  });

  function forgotPassword() {
    alert('To reset your password, email us at hello@circlesmy.com and we\'ll sort you out!');
  }

  function showFieldError(fieldId, errorId) {
    document.getElementById(fieldId).classList.add('error');
    document.getElementById(errorId).classList.add('visible');
  }
  function clearErrors() {
    document.querySelectorAll('.form-input').forEach(i => i.classList.remove('error'));
    document.querySelectorAll('.form-error').forEach(e => e.classList.remove('visible'));
    document.getElementById('global-error').classList.remove('visible');
  }
</script>
</body>
</html>

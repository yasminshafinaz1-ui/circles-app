<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community — Circles</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .community-hero {
      padding: 72px max(20px, calc((100vw - 1100px)/2)) 48px;
      border-bottom: 2px solid var(--border);
    }
    .c-back { font-size: 0.85rem; font-weight: 700; color: var(--ink-light); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 28px; }
    .c-back:hover { color: var(--ink); }
    .c-hero-top { display: flex; align-items: flex-start; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
    .c-hero-emoji {
      font-size: 3rem; width: 80px; height: 80px;
      background: var(--white); border-radius: 22px;
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .c-hero-info { flex: 1; min-width: 200px; }
    .c-hero-info h1 { font-size: 2rem; margin: 8px 0 10px; }
    .c-hero-info p { font-size: 1rem; color: var(--ink-light); max-width: 580px; line-height: 1.6; }
    .c-hero-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
    .member-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--white); border: 2px solid var(--border);
      border-radius: var(--radius-pill); padding: 8px 16px;
      font-size: 0.88rem; font-weight: 700;
    }

    .who-section {
      padding: 36px max(20px, calc((100vw - 1100px)/2));
      background: var(--white); border-bottom: 2px solid var(--border);
    }
    .who-section h3 { margin-bottom: 14px; font-size: 1rem; color: var(--ink-light); font-family: 'Nunito', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .who-tags { display: flex; gap: 10px; flex-wrap: wrap; }
    .who-tag {
      padding: 8px 16px; border-radius: var(--radius-pill);
      background: var(--offwhite); border: 2px solid var(--border);
      font-size: 0.85rem; font-weight: 700;
    }

    .events-section {
      padding: 40px max(20px, calc((100vw - 1100px)/2)) 80px;
    }
    .events-section h2 { margin-bottom: 20px; }

    .btn-joined { background: var(--mint) !important; color: var(--ink) !important; cursor: default; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span class="nav-logo-dot"></span>Circles</a>
    <div class="nav-links">
      <a href="/communities.html">Communities</a>
      <a href="/events.html" class="hide-mobile">Events</a>
      <a href="/login.html" id="nav-login" class="hide-mobile">Log In</a>
      <a href="/dashboard.html" id="nav-dashboard" class="btn btn-secondary btn-sm" style="display:none">My Dashboard</a>
      <a href="/signup.html" id="nav-cta" class="nav-cta">Sign Up Free</a>
      <button id="nav-logout" onclick="signOut()" class="btn btn-secondary btn-sm" style="display:none">Log Out</button>
    </div>
  </div>
</nav>

<div class="pt-nav" id="page-content">
  <div style="text-align:center;padding:80px"><div class="spinner"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
<script>
  async function loadCommunity() {
    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) {
      document.getElementById('page-content').innerHTML =
        `<div class="empty-state" style="padding:80px 20px"><h3>Community not found</h3><p><a href="/communities.html">← Browse all communities</a></p></div>`;
      return;
    }

    try {
      const { community, events } = await api(`/api/communities/${id}`);
      document.title = `${community.name} — Circles`;

      // Check logged-in user's membership level
      let userMembershipType = null;
      const session = await getSession();
      if (session) {
        const sb = await initSupabaseClient();
        if (sb) {
          const { data } = await sb.from('memberships')
            .select('membership_type').eq('community_id', id).eq('user_id', session.user.id).single();
          userMembershipType = data?.membership_type || null;
        }
      }
      const isFollower = userMembershipType === 'follower';
      const isMember = userMembershipType === 'member';

      const catColor = getCategoryBg(community.category);

      // Load user RSVP map for events
      let rsvpMap = {};
      if (session) {
        const sb = await initSupabaseClient();
        if (sb && events?.length) {
          const eventIds = events.map(e => e.id);
          const { data: rsvps } = await sb.from('rsvps')
            .select('event_id,status').in('event_id', eventIds)
            .eq('user_id', session.user.id).neq('status','cancelled');
          (rsvps||[]).forEach(r => { rsvpMap[r.event_id] = r.status; });
        }
      }

      document.getElementById('page-content').innerHTML = `
        <div class="community-hero" style="background:linear-gradient(135deg,${catColor} 0%,var(--offwhite) 60%)">
          <a href="/communities.html" class="c-back">← All Communities</a>
          <div class="c-hero-top">
            <div class="c-hero-emoji">${community.cover_emoji || '🌟'}</div>
            <div class="c-hero-info">
              <span class="badge badge-${community.category}">${getCategoryEmoji(community.category)} ${getCategoryLabel(community.category)}</span>
              <h1>${community.name}</h1>
              <p>${community.description || ''}</p>
            </div>
          </div>
          <div class="c-hero-actions">
            <button class="btn btn-primary btn-lg ${isMember ? 'btn-joined' : isFollower ? 'btn-following' : ''}"
              id="follow-btn"
              onclick="handleFollowCommunity('${community.id}', this)"
              ${isMember ? 'disabled' : ''}>
              ${isMember ? '✓ Member' : isFollower ? 'Following ✓' : 'Follow →'}
            </button>
            ${community.member_count > 0
              ? `<div class="member-badge">👥 ${community.member_count} member${community.member_count !== 1 ? 's' : ''}</div>`
              : ''}
            ${community.follower_count > 0
              ? `<div class="member-badge" style="opacity:0.7">${community.follower_count} follower${community.follower_count !== 1 ? 's' : ''}</div>`
              : ''}
          </div>
          ${isMember && community.whatsapp_link ? `
          <div style="margin-top:16px">
            <a href="${community.whatsapp_link}" target="_blank" rel="noopener"
               class="btn btn-accent btn-sm">
              💬 Join WhatsApp Group
            </a>
          </div>` : ''}
          ${isFollower ? `
          <p style="margin-top:14px;font-size:0.85rem;color:var(--ink-light)">
            RSVP and attend an event to unlock full membership and the WhatsApp group 🔓
          </p>` : ''}
        </div>

        ${community.who_its_for ? `
        <div class="who-section">
          <h3>Who it's for</h3>
          <div class="who-tags">
            ${community.who_its_for.split('·').map(v => `<span class="who-tag">${v.trim()}</span>`).join('')}
          </div>
        </div>` : ''}

        <div class="events-section">
          <h2>Upcoming Events</h2>
          ${events && events.length
            ? `<div class="flex-col">${events.map(e => renderEventRow(e, rsvpMap)).join('')}</div>`
            : `<div class="empty-state"><div class="empty-icon">📅</div><h3>No upcoming events yet</h3><p>This community is cooking something up. Check back soon!</p></div>`
          }
        </div>`;

    } catch (e) {
      document.getElementById('page-content').innerHTML =
        `<div class="empty-state" style="padding:80px 20px"><h3>Could not load community</h3><p>${e.message}</p><a href="/communities.html">← Back to communities</a></div>`;
    }
  }

  loadCommunity();
</script>
</body>
</html>

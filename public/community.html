<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community — Circles</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .community-hero {
      padding: 80px max(20px, calc((100vw - 1200px)/2)) 48px;
      background: linear-gradient(135deg, var(--cat-color, var(--lavender)) 0%, var(--offwhite) 60%);
      border-bottom: 2px solid var(--border);
    }
    .c-hero-top { display: flex; align-items: flex-start; gap: 24px; margin-bottom: 24px; }
    .c-hero-emoji {
      font-size: 3.5rem;
      width: 80px; height: 80px;
      background: var(--white);
      border-radius: 22px;
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .c-hero-info { flex: 1; }
    .c-hero-info h1 { font-size: 2rem; margin-bottom: 8px; }
    .c-hero-info p { font-size: 1rem; max-width: 580px; }
    .c-hero-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    .member-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--white);
      border: 2px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink);
    }

    .who-section {
      padding: 40px max(20px, calc((100vw - 1200px)/2));
      background: var(--white);
      border-bottom: 2px solid var(--border);
    }
    .who-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .who-tag {
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      background: var(--offwhite);
      border: 2px solid var(--border);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink);
    }

    .community-events {
      padding: 40px max(20px, calc((100vw - 1200px)/2));
    }
    .community-events h2 { margin-bottom: 20px; }
  </style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span class="nav-logo-dot"></span>Circles</a>
    <div class="nav-links">
      <a href="/communities.html">Communities</a>
      <a href="/events.html" class="hide-mobile">Events</a>
      <a href="/login.html" id="nav-login" class="hide-mobile">Log In</a>
      <a href="/dashboard.html" id="nav-dashboard" class="btn btn-secondary btn-sm" style="display:none">My Dashboard</a>
      <a href="/signup.html" id="nav-cta" class="nav-cta">Sign Up Free</a>
      <button id="nav-logout" onclick="signOut()" class="btn btn-secondary btn-sm" style="display:none">Log Out</button>
    </div>
  </div>
</nav>

<div class="pt-nav" id="page-content">
  <div style="text-align:center;padding:60px"><div class="spinner"></div></div>
</div>

<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
<script>
  const CAT_BG = {
    active: '#FFE5E5',
    creative: '#E8D5F5',
    career: '#D6EEFF',
    wellness: '#C8F7C5',
    social: '#FFE5D9'
  };

  async function loadCommunity() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) {
      document.getElementById('page-content').innerHTML = '<div class="empty-state"><h3>Community not found</h3><p><a href="/communities.html">Browse all communities →</a></p></div>';
      return;
    }

    try {
      const { community, events } = await api(`/api/communities/${id}`);
      document.title = `${community.name} — Circles`;

      // Check if user joined
      let joined = false;
      const session = await getSession();
      if (session) {
        const sb = await initSupabaseClient();
        if (sb) {
          const { data } = await sb.from('community_members').select('id').eq('community_id', id).eq('user_id', session.user.id).single();
          joined = !!data;
        }
      }

      const catColor = CAT_BG[community.category] || '#FAFAF8';

      document.getElementById('page-content').innerHTML = `
        <div class="community-hero" style="--cat-color:${catColor}">
          <div class="c-hero-top">
            <div class="c-hero-emoji">${community.cover_emoji || '🌟'}</div>
            <div class="c-hero-info">
              <span class="badge badge-${community.category}" style="margin-bottom:8px">${getCategoryLabel(community.category)}</span>
              <h1>${community.name}</h1>
              <p>${community.description || ''}</p>
            </div>
          </div>
          <div class="c-hero-actions">
            <button class="btn btn-primary btn-lg ${joined ? 'btn-joined' : ''}"
              id="join-btn"
              onclick="handleJoinCommunity('${community.id}', '${(community.whatsapp_link || '').replace(/'/g, '')}', this)"
              ${joined ? 'disabled' : ''}>
              ${joined ? 'Joined ✓' : 'Join Community →'}
            </button>
            <div class="member-badge">👥 ${community.member_count || 0} members</div>
          </div>
        </div>

        <div class="who-section">
          <h3>Who it's for</h3>
          <div class="who-grid">
            <span class="who-tag">👤 ${community.who_gender || 'All genders'}</span>
            <span class="who-tag">🎂 Ages ${community.who_age_min}–${community.who_age_max}</span>
            ${community.who_vibe ? community.who_vibe.split(',').map(v => `<span class="who-tag">✨ ${v.trim()}</span>`).join('') : ''}
          </div>
        </div>

        <div class="community-events">
          <h2>Upcoming Events</h2>
          ${events && events.length
            ? `<div class="flex-col">${events.map(e => renderEventRow(e)).join('')}</div>`
            : `<div class="empty-state"><div class="empty-icon">📅</div><h3>No upcoming events</h3><p>Check back soon — this community is getting something planned!</p></div>`
          }
        </div>`;

    } catch (e) {
      document.getElementById('page-content').innerHTML = `<div class="empty-state"><h3>Could not load community</h3><p>${e.message}</p><a href="/communities.html">← Back to communities</a></div>`;
    }
  }

  loadCommunity();
</script>
</body>
</html>

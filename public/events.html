<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — Circles</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .page-hero {
      background: var(--white);
      border-bottom: 2px solid var(--border);
      padding: 56px max(20px, calc((100vw - 1200px)/2)) 36px;
    }
    .page-hero h1 { margin-bottom: 8px; }
    .page-hero p { font-size: 1rem; color: var(--ink-light); margin-bottom: 28px; max-width: 520px; }
    .main-content { padding: 36px max(20px, calc((100vw - 1200px)/2)) 80px; }
    .results-count { font-size: 0.85rem; font-weight: 700; color: var(--ink-light); margin-bottom: 20px; }

    /* Event rows */
    .e-row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 16px;
      align-items: center;
      background: var(--offwhite);
      border-radius: 20px;
      padding: 18px 20px;
      border: 2px solid transparent;
      margin-bottom: 10px;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      cursor: default;
    }
    .e-row:hover { background: var(--white); transform: translateX(4px); }
    .e-row-active:hover   { border-color: var(--active); }
    .e-row-creative:hover { border-color: var(--creative); }
    .e-row-career:hover   { border-color: var(--career); }
    .e-row-wellness:hover { border-color: var(--wellness); }
    .e-row-social:hover   { border-color: var(--social); }

    .e-date-box { text-align: center; }
    .e-date-day { font-family: 'Fraunces', serif; font-size: 1.8rem; font-weight: 900; line-height: 1; }
    .e-date-mon { font-size: 0.7rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-light); margin-top: 2px; }

    .e-info h4 { font-size: 1rem; margin-bottom: 6px; }
    .e-meta { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; font-weight: 700; color: var(--ink-light); }

    .e-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .e-price { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 900; }
    .e-price.free { font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 800; color: var(--wellness); }
    .btn-going { background: var(--mint) !important; color: var(--ink) !important; }

    @media(max-width:600px) {
      .e-row { grid-template-columns: 50px 1fr; }
      .e-right { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span class="nav-logo-dot"></span>Circles</a>
    <div class="nav-links">
      <a href="/communities.html" class="hide-mobile">Communities</a>
      <a href="/events.html" class="active">Events</a>
      <a href="/login.html" id="nav-login" class="hide-mobile">Log In</a>
      <a href="/dashboard.html" id="nav-dashboard" class="btn btn-secondary btn-sm" style="display:none">My Dashboard</a>
      <a href="/signup.html" id="nav-cta" class="nav-cta">Sign Up Free</a>
      <button id="nav-logout" onclick="signOut()" class="btn btn-secondary btn-sm" style="display:none">Log Out</button>
    </div>
  </div>
</nav>

<div class="pt-nav">
  <div class="page-hero">
    <p class="section-label" style="color:var(--career);margin-bottom:8px">KL & PJ · Upcoming Events</p>
    <h1>Don't waste your weekend!</h1>
    <p>Events from vetted communities. RSVP to lock in your spot and meet people looking for the same thing as you.</p>
    <div class="cat-strip" id="cat-filter">
      <button class="cat-pill active" data-cat="all">✨ All</button>
      <button class="cat-pill" data-cat="active" style="--c:var(--active)">🏃 Active & Outdoors</button>
      <button class="cat-pill" data-cat="creative" style="--c:var(--creative)">🎨 Creative</button>
      <button class="cat-pill" data-cat="career" style="--c:var(--career)">🚀 Career & Hustle</button>
      <button class="cat-pill" data-cat="wellness" style="--c:var(--wellness)">🌸 Wellness</button>
      <button class="cat-pill" data-cat="social" style="--c:var(--social)">💛 Social & Friendship</button>
    </div>
  </div>

  <div class="main-content">
    <div class="results-count" id="results-count"></div>
    <div id="events-list"><div class="spinner"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
<script>
  let allEvents = [];
  let activeCategory = 'all';
  let userRsvpMap = {};

  async function loadEvents() {
    try {
      const data = await api('/api/events');
      allEvents = data.events || [];

      const session = await getSession();
      if (session) {
        const sb = await initSupabaseClient();
        if (sb) {
          const { data: rsvps } = await sb.from('rsvps')
            .select('event_id,status').eq('user_id', session.user.id).neq('status','cancelled');
          (rsvps||[]).forEach(r => { userRsvpMap[r.event_id] = r.status; });
        }
      }

      renderEvents();
    } catch (e) {
      document.getElementById('events-list').innerHTML =
        `<div class="empty-state"><div class="empty-icon">😕</div><h3>Could not load events</h3><p>${e.message}</p></div>`;
    }
  }

  function renderEvents() {
    let list = allEvents;
    if (activeCategory !== 'all') {
      list = list.filter(e => e.communities?.category === activeCategory);
    }

    const el = document.getElementById('events-list');
    document.getElementById('results-count').textContent =
      `${list.length} upcoming event${list.length === 1 ? '' : 's'}`;

    if (!list.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">📅</div><h3>No events in this category</h3><p>Try a different filter or check back soon.</p></div>`;
      return;
    }
    el.innerHTML = list.map(e => renderEventRow(e, userRsvpMap)).join('');
  }

  document.getElementById('cat-filter').addEventListener('click', e => {
    const pill = e.target.closest('.cat-pill');
    if (!pill) return;
    document.querySelectorAll('#cat-filter .cat-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    activeCategory = pill.dataset.cat;
    renderEvents();
  });

  // Handle ?category= URL param
  const catParam = new URLSearchParams(window.location.search).get('category');
  if (catParam) {
    activeCategory = catParam;
    document.querySelectorAll('#cat-filter .cat-pill').forEach(p => {
      p.classList.toggle('active', p.dataset.cat === catParam);
    });
  }

  loadEvents();
</script>
</body>
</html>
